name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs for the same PR or branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # This name is what branch protection requires as a status check.
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm 10 crashes resolving Vitest's peer dependencies; the lockfile was
      # generated with npm 11.
      - name: Install npm 11
        run: npm install --global npm@11.21.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Builds the frontend (wrangler.jsonc needs apps/frontend/build), then
      # runs the Worker tests inside workerd.
      - name: Test
        run: npm test
